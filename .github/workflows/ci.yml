name: ⚗️ FileKit CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-dbus-headers:
    uses: ./.github/workflows/linux-dbus-headers.yaml

  build-modules:
    name: 🔨 Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Libraries
            tasks: :filekit-core:assemble :filekit-dialogs:assemble :filekit-dialogs-compose:assemble :filekit-coil:assemble
          - name: Shared sample
            tasks: :sample:shared:assemble
          - name: Web sample
            tasks: :sample:webApp:assemble
          - name: Android sample
            tasks: :sample:androidApp:assemble
          - name: Desktop samples
            tasks: :sample:desktopApp:assemble :sample:nucleusApp:assemble
          - name: Windows native sample
            tasks: :sample:windowsNativeApp:assemble
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🔧 Install Linux dialog dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🔨 Build project
        shell: bash
        env:
          BUILD_TASKS: ${{ matrix.tasks }}
        run: |
          read -r -a build_tasks <<< "$BUILD_TASKS"
          ./gradlew "${build_tasks[@]}" --max-workers=2

  test-desktop:
    name: 🖥️ Test Desktop
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run JVM Tests
        run: ./gradlew jvmTest

  test-android:
    name: 🤖 Test Android
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run Android Unit Tests
        run: ./gradlew testAndroidHostTest

  test-ios:
    name: 🍎 Test iOS
    runs-on: macos-26
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run iOS Tests
        run: ./gradlew iosSimulatorArm64Test

  test-watchos:
    name: ⌚️ Test watchOS
    runs-on: macos-26
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run watchOS Tests
        run: ./gradlew watchosSimulatorArm64Test

  test-macos:
    name: 🍏 Test macOS
    runs-on: macos-26
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: 🧪 Run macOS Tests
        run: ./gradlew macosArm64Test --no-daemon

  test-linux:
    name: 🐧 Test Linux
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🔧 Install Linux dialog dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev dbus

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run Linux Native Tests
        run: dbus-run-session -- ./gradlew linuxX64Test --no-daemon

  test-linux-publications:
    name: Verify Linux publications on macOS
    needs: linux-dbus-headers
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v4
        with:
          name: linux-dbus-headers
          path: build/dbus-headers
      - name: Build Linux artifacts and root metadata
        run: >-
          ./gradlew -Pfilekit.dbusHeaders=build/dbus-headers -PRELEASE_SIGNING_ENABLED=false
          :filekit-dialogs:publishLinuxX64PublicationToMavenLocal
          :filekit-dialogs:publishLinuxArm64PublicationToMavenLocal
          :filekit-dialogs:generateMetadataFileForKotlinMultiplatformPublication
      - name: Verify both Linux variants are advertised
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          metadata = json.loads(Path("filekit-dialogs/build/publications/kotlinMultiplatform/module.json").read_text())
          targets = {v["attributes"].get("org.jetbrains.kotlin.native.target") for v in metadata["variants"]}
          assert {"linux_x64", "linux_arm64"} <= targets, targets
          PYTHON

  lint:
    name: 🚨 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📥 Download ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint 
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: 👮 Download ktlint-compose rules
        run: curl -sSLO https://github.com/mrmans0n/compose-rules/releases/download/v0.6.6/ktlint-compose-0.6.6-all.jar

      - name: 🚨 Run ktlint
        run: ktlint '**/*.kt' '**/*.kts' '!**/build/**' -R ktlint-compose-0.6.6-all.jar

  build:
    # Keep the existing build check name as the aggregate gate.
    name: 💆‍♀️ Build FileKit
    if: ${{ always() }}
    needs: [build-modules, test-desktop, test-android, test-ios, test-watchos, test-macos, test-linux, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and test to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

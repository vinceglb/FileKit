name: ⚗️ FileKit CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 💆‍♀️ Build FileKit
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🔨 Build project
        shell: bash
        run: |
          report_resources() {
            echo "::group::Build resources $(date -u +%FT%TZ)"
            free -m
            df -h / "$RUNNER_TEMP"
            ps -eo pid,ppid,comm,rss --sort=-rss | head -n 16 || true
            echo "::endgroup::"
          }
          (
            while true; do
              report_resources
              sleep 30
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; report_resources' EXIT
          ./gradlew assemble --max-workers=2

  test-desktop:
    name: 🖥️ Test Desktop
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run JVM Tests
        run: ./gradlew jvmTest

  test-android:
    name: 🤖 Test Android
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run Android Unit Tests
        run: ./gradlew testAndroidHostTest

  test-ios:
    name: 🍎 Test iOS
    needs: build
    runs-on: macos-26
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run iOS Tests
        run: ./gradlew iosSimulatorArm64Test

  test-watchos:
    name: ⌚️ Test watchOS
    needs: build
    runs-on: macos-26
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run watchOS Tests
        run: ./gradlew watchosSimulatorArm64Test

  test-macos:
    name: 🍏 Test macOS
    needs: build
    runs-on: macos-26
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: 🧪 Run macOS Tests
        run: ./gradlew macosArm64Test --no-daemon

  test-linux:
    name: 🐧 Test Linux
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🧪 Run Linux Native Tests
        run: ./gradlew linuxX64Test

  lint:
    name: 🚨 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v7

      - name: 🍉 Configure JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📥 Download ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint 
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: 👮 Download ktlint-compose rules
        run: curl -sSLO https://github.com/mrmans0n/compose-rules/releases/download/v0.6.6/ktlint-compose-0.6.6-all.jar

      - name: 🚨 Run ktlint
        run: ktlint '**/*.kt' '**/*.kts' '!**/build/**' -R ktlint-compose-0.6.6-all.jar

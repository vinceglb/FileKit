<!doctype html>
<!-- Review board: every exported asset plus the palette, on one page. Open it with `npm run preview`. -->
<html>
<head>
<meta charset="utf-8">
<title>FileKit brand board</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('../fonts/Inter-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('../fonts/Inter-Medium.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  body { max-width: 960px; margin: 0 auto; padding: 32px 24px; background: #0B0D0C; color: #D8DCD9; font: 14px/1.5 'Inter', sans-serif; }
  h2 { font-weight: 500; font-size: 13px; color: #8C948F; margin: 28px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
  img { display: block; max-width: 100%; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { border-radius: 12px; padding: 28px; display: flex; align-items: center; gap: 20px; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .swatch { border-radius: 10px; padding: 48px 12px 10px; font: 12px/1.4 ui-monospace, monospace; }
  .swatch span { display: block; opacity: .75; }
</style>
</head>
<body>
<h2>README hero · brand/exports/readme-hero.webp</h2>
<img src="../exports/readme-hero.webp" alt="">
<h2>Social preview · brand/exports/social-preview.jpg — OG image · docs/brand/og.jpg</h2>
<div class="two"><img src="../exports/social-preview.jpg" alt=""><img src="../../docs/brand/og.jpg" alt=""></div>
<h2>Docs hero · docs/brand/hero.webp</h2>
<img src="../../docs/brand/hero.webp" alt="">
<h2>Logos · docs/brand/logo-{light,dark}.svg — favicon · docs/brand/favicon.svg</h2>
<div class="two">
  <div class="tile" style="background:#fff"><img src="../../docs/brand/logo-light.svg" style="height:40px" alt=""><img src="../../docs/brand/favicon.svg" style="height:32px" alt=""><img src="../../docs/brand/favicon.svg" style="height:16px" alt=""></div>
  <div class="tile" style="background:#07160E"><img src="../../docs/brand/logo-dark.svg" style="height:40px" alt=""></div>
</div>
<h2>Palette · brand/palette.json</h2>
<div class="swatches" id="swatches"></div>
<script type="module">
  const palette = await (await fetch('../palette.json')).json();
  const luminance = (hex) => parseInt(hex.slice(1, 3), 16) * .3 + parseInt(hex.slice(3, 5), 16) * .59 + parseInt(hex.slice(5, 7), 16) * .11;
  const swatch = (hex, name) => `<div class="swatch" style="background:${hex};color:${luminance(hex) > 140 ? '#07160E' : '#fff'}">${hex}<span>${name}</span></div>`;
  document.getElementById('swatches').innerHTML = [
    ...Object.entries(palette.docs).map(([k, v]) => swatch(v, `docs ${k}`)),
    swatch(palette.ink, 'ink'),
    ...palette.background.dark.stops.map((v, i) => swatch(v, `background ${i + 1}/5`)),
  ].join('');
</script>
</body>
</html>

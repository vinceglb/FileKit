<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileKit sample</title>
    <meta name="description" content="Try FileKit, the Kotlin Multiplatform file picker and file system library, in your browser.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <script>
        // Match the loading screen to the requested theme to avoid a flash in documentation embeds
        (function () {
            var theme = new URLSearchParams(window.location.search).get("theme");
            var dark = theme ? theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.classList.toggle("dark", dark);
        })();
    </script>
</head>
<body>
<svg class="loader" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle class="loader-track" cx="25" cy="25" r="20" stroke-width="4" fill="none"/>
    <circle class="loader-arc" cx="25" cy="25" r="20" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
